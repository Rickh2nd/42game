<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Texas 42 Dominoes</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <div id="sceneWrap">
        <canvas id="gameCanvas"></canvas>
        <div id="scoreboard">
          <div class="scoreCard" id="score-teamA">
            <div class="scoreLabel">TEAM 1 SCORE</div>
            <div class="scoreMain" id="score-teamA-main">0/0</div>
          </div>
          <div class="scoreCard" id="score-teamB">
            <div class="scoreLabel">TEAM 2 SCORE</div>
            <div class="scoreMain" id="score-teamB-main">0/0</div>
          </div>
        </div>
        <div id="tableHud">
          <div class="hudBlock hudLeft">
            <div class="hudLabel">BID</div>
            <div class="hudValue" id="hudBidValue">-</div>
          </div>
          <div class="hudBlock hudRight">
            <div class="hudLabel">TRUMP</div>
            <div class="hudValue" id="hudTrumpValue">-</div>
          </div>
        </div>

        <div id="turnTimerHud">TIME: --</div>

        <div id="nameplates">
          <div class="nameplate" id="nameplate-0" data-seat="0"></div>
          <div class="nameplate" id="nameplate-1" data-seat="1"></div>
          <div class="nameplate" id="nameplate-2" data-seat="2"></div>
          <div class="nameplate" id="nameplate-3" data-seat="3"></div>
        </div>
        <div id="emojiOverlays"></div>

        <button id="panelToggle" title="Toggle menu">☰</button>
      </div>

      <aside id="sidePanel" class="closed">
        <header class="panelHeader">
          <div class="panelTitle">Texas 42</div>
          <div class="buttonRow">
            <button id="changeAvatarBtn" title="Change avatar">Change Avatar</button>
            <button id="closePanelBtn" class="panelClose" title="Close">×</button>
          </div>
        </header>

        <section id="section-room" class="panelSection">
          <h2>ROOM</h2>
          <div class="controlRow">
            <label for="roomIdInput">Room ID</label>
            <input id="roomIdInput" maxlength="10" placeholder="ABCD12" />
          </div>
          <div class="buttonRow">
            <button id="createRoomBtn">Create Room</button>
            <button id="joinRoomBtn">Join Room</button>
            <button id="leaveRoomBtn">Leave</button>
          </div>
          <div id="roomStatus" class="smallText"></div>
        </section>

        <section id="section-players" class="panelSection">
          <h2>PLAYERS</h2>
          <div id="seatControls"></div>
        </section>

        <section id="section-game" class="panelSection">
          <h2>GAME</h2>
          <div class="buttonRow">
            <button id="startGameBtn">Start Game</button>
            <button id="restartGameBtn">Restart Game</button>
            <button id="resetViewBtn">Reset View</button>
          </div>
          <div class="controlRow">
            <label>
              <input id="timerEnabledToggle" type="checkbox" />
              Enable Turn Timer
            </label>
          </div>
          <div class="buttonRow">
            <button id="timerPauseBtn">Pause Timer</button>
          </div>
          <div id="timerStateText" class="smallText">Timer Off</div>
          <div class="controlRow">
            <label for="environmentSelect">Background</label>
            <select id="environmentSelect"></select>
            <img id="environmentPreview" alt="Background preview" />
            <div id="environmentStateText" class="smallText"></div>
          </div>
        </section>

        <section id="section-bidding" class="panelSection">
          <h2>BIDDING</h2>
          <div class="buttonRow">
            <button id="passBidBtn">Pass</button>
          </div>
          <div id="bidButtons" class="gridButtons"></div>
        </section>

        <section id="section-trump" class="panelSection">
          <h2>TRUMP</h2>
          <div class="smallText" id="modeHelp">Bid winner chooses mode after bidding.</div>
          <div id="modeButtons" class="buttonRow">
            <button data-mode="trumps">TRUMPS</button>
            <button data-mode="followMe">FOLLOW ME</button>
            <button data-mode="sevens">SEVENS</button>
          </div>
          <div id="trumpButtons" class="gridButtons"></div>
        </section>

        <section id="section-marks" class="panelSection">
          <h2>MARKS</h2>
          <div class="marksBlock">
            <div class="marksTitle">Hand Wins</div>
            <div class="marksCols">
              <div class="marksCol">
                <div class="marksColLabel">Team 1</div>
                <svg id="menu-rounds-teamA" class="menuTallySvg" viewBox="0 0 220 42" aria-label="Team 1 hand wins"></svg>
              </div>
              <div class="marksCol">
                <div class="marksColLabel">Team 2</div>
                <svg id="menu-rounds-teamB" class="menuTallySvg" viewBox="0 0 220 42" aria-label="Team 2 hand wins"></svg>
              </div>
            </div>
          </div>
          <div class="marksBlock">
            <div class="marksTitle">Game Marks</div>
            <div class="marksCols">
              <div class="marksCol">
                <div class="marksColLabel">Team 1</div>
                <svg id="menu-marks-teamA" class="menuTallySvg" viewBox="0 0 220 42" aria-label="Team 1 game marks"></svg>
              </div>
              <div class="marksCol">
                <div class="marksColLabel">Team 2</div>
                <svg id="menu-marks-teamB" class="menuTallySvg" viewBox="0 0 220 42" aria-label="Team 2 game marks"></svg>
              </div>
            </div>
          </div>
        </section>

        <div id="eventLog" aria-live="polite"></div>
      </aside>
    </div>

    <div id="avatarModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Avatar picker">
      <div class="modalBackdrop" id="avatarModalBackdrop"></div>
      <div class="modalPanel">
        <div class="modalHeader">
          <h2>Choose Avatar</h2>
          <button id="closeAvatarModalBtn" class="panelClose">×</button>
        </div>
        <div id="avatarPickerStatus" class="smallText"></div>
        <div id="avatarGrid" class="avatarGrid"></div>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
